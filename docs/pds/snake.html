<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Arcade Snake Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #080811;
            color: #fff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Neon Glow Effects */
        .glow-title {
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff;
        }

        .glow-box-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
        }

        .glow-box-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border: 2px solid #ff007f;
        }

        .btn-arcade {
            transition: all 0.15s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-arcade:active {
            transform: scale(0.95);
        }

        canvas {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), 0 0 50px rgba(255, 0, 127, 0.15);
            background: rgba(10, 10, 26, 0.95);
        }

        /* Grid Background Pattern */
        .grid-bg {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 grid-bg">

    <!-- Header Section -->
    <header class="text-center my-2 sm:my-4 z-10 w-full max-w-lg">
        <h1 class="text-3xl sm:text-5xl font-black tracking-wider text-cyan-400 glow-title mb-1">NEON SNAKE</h1>
        <p class="text-xs sm:text-sm text-pink-400 font-bold tracking-widest uppercase">RETRO ARCADE EDITION</p>
    </header>

    <!-- Score & Control Panel Bar -->
    <div class="w-full max-w-lg flex items-center justify-between gap-2 mb-3 px-2">
        <div class="glow-box-cyan rounded-lg px-3 py-1.5 bg-black/60 flex-1 text-center">
            <div class="text-[10px] text-cyan-300 font-semibold tracking-wider">SCORE</div>
            <div id="score" class="pixel-font text-lg sm:text-xl text-cyan-400">0</div>
        </div>
        
        <div class="glow-box-pink rounded-lg px-3 py-1.5 bg-black/60 flex-1 text-center">
            <div class="text-[10px] text-pink-300 font-semibold tracking-wider">HIGH SCORE</div>
            <div id="highScore" class="pixel-font text-lg sm:text-xl text-pink-500">0</div>
        </div>

        <button id="soundToggle" class="glow-box-cyan bg-black/60 rounded-lg p-2.5 text-cyan-400 hover:bg-cyan-950/40 transition">
            <svg id="soundIconOn" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            <svg id="soundIconOff" class="w-6 h-6 hidden text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
        </button>
    </div>

    <!-- Canvas Container -->
    <div class="relative w-full max-w-lg aspect-square flex justify-center items-center">
        <canvas id="gameCanvas" class="rounded-xl border-2 border-cyan-500/50 w-full h-full object-contain"></canvas>

        <!-- Start / Game Settings Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-xl flex flex-col items-center justify-center p-6 text-center z-20">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-6 glow-title">PRESS START</h2>
            
            <!-- Difficulty Selector -->
            <div class="mb-6 w-full max-w-xs">
                <label class="block text-xs text-cyan-300 mb-2 font-bold tracking-widest">DIFFICULTY</label>
                <div class="grid grid-cols-3 gap-2">
                    <button class="diff-btn btn-arcade py-2 rounded border border-cyan-500 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20 active" data-speed="140">EASY</button>
                    <button class="diff-btn btn-arcade py-2 rounded border border-cyan-500 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20" data-speed="90">MEDIUM</button>
                    <button class="diff-btn btn-arcade py-2 rounded border border-cyan-500 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20" data-speed="50">HARD</button>
                </div>
            </div>

            <button id="startBtn" class="btn-arcade glow-box-pink bg-pink-600 hover:bg-pink-500 text-white font-black py-3 px-8 rounded-lg text-lg tracking-wider transform transition active:scale-95">
                START GAME
            </button>
        </div>

        <!-- Pause Overlay -->
        <div id="pauseOverlay" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center z-20">
            <div class="text-3xl font-black text-cyan-400 glow-title mb-4">PAUSED</div>
            <p class="text-xs text-gray-400 mb-6">Press SPACE or Resume button</p>
            <button id="resumeBtn" class="btn-arcade glow-box-cyan bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-6 rounded-lg">
                RESUME
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="hidden absolute inset-0 bg-black/90 backdrop-blur-md rounded-xl flex flex-col items-center justify-center p-6 text-center z-20">
            <h2 class="text-3xl sm:text-4xl font-black text-pink-500 glow-title mb-2">GAME OVER</h2>
            <div class="text-gray-300 text-sm mb-4">Final Score: <span id="finalScore" class="pixel-font text-cyan-400">0</span></div>
            
            <div id="newHighScoreMsg" class="hidden text-xs text-yellow-400 font-bold mb-6 animate-pulse">
                🏆 NEW HIGH SCORE! 🏆
            </div>

            <button id="restartBtn" class="btn-arcade glow-box-cyan bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-lg text-base tracking-wider">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- Mobile D-Pad Controls -->
    <div class="w-full max-w-md my-3 flex flex-col items-center sm:hidden">
        <div class="grid grid-cols-3 gap-2 w-48 h-36">
            <div></div>
            <button id="btnUp" class="btn-arcade bg-slate-800/80 border border-cyan-500/50 rounded-lg flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
            </button>
            <div></div>
            <button id="btnLeft" class="btn-arcade bg-slate-800/80 border border-cyan-500/50 rounded-lg flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button id="btnPause" class="btn-arcade bg-slate-800/80 border border-pink-500/50 rounded-lg flex items-center justify-center text-pink-400 text-xs font-bold active:bg-pink-500/30">
                PAUSE
            </button>
            <button id="btnRight" class="btn-arcade bg-slate-800/80 border border-cyan-500/50 rounded-lg flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
            <div></div>
            <button id="btnDown" class="btn-arcade bg-slate-800/80 border border-cyan-500/50 rounded-lg flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div></div>
        </div>
    </div>

    <!-- Desktop Controls Instruction -->
    <footer class="text-center text-xs text-gray-500 hidden sm:block my-2">
        Controls: <span class="text-gray-300">Arrow Keys / WASD</span> to move • <span class="text-gray-300">Space</span> to pause
    </footer>

    <script>
        // --- Web Audio API Synthesizer ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playEatSound() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playGameOverSound() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            playTurnSound() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.setValueAtTime(200, this.ctx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sound = new SoundFX();

        const GRID_SIZE = 20; // 20x20 grid
        let tileSize = 20;

        // Game State Variables
        let snake = [];
        let food = { x: 0, y: 0, type: 'regular' };
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_snake_highscore')) || 0;
        let gameSpeed = 90; // Default Medium
        let gameInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameRunning = false;
        let particles = [];

        // UI Element References
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const newHighScoreMsg = document.getElementById('newHighScoreMsg');
        const soundToggle = document.getElementById('soundToggle');
        const soundIconOn = document.getElementById('soundIconOn');
        const soundIconOff = document.getElementById('soundIconOff');

        highScoreEl.innerText = highScore;

        // Resize Canvas dynamically
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size;
            canvas.height = size;
            tileSize = size / GRID_SIZE;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
            // 20% chance for special golden food
            food.type = Math.random() < 0.2 ? 'special' : 'regular';
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: (x + 0.5) * tileSize,
                    y: (y + 0.5) * tileSize,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines faintly
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Draw Food
            const foodPxX = food.x * tileSize + tileSize / 2;
            const foodPxY = food.y * tileSize + tileSize / 2;
            const radius = tileSize / 2 - 2;

            ctx.save();
            ctx.beginPath();
            ctx.arc(foodPxX, foodPxY, radius, 0, Math.PI * 2);
            if (food.type === 'special') {
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
            } else {
                ctx.fillStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
            }
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.restore();

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.save();
                const pxX = segment.x * tileSize;
                const pxY = segment.y * tileSize;

                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#00f3ff';
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(pxX + 1, pxY + 1, tileSize - 2, tileSize - 2);

                    // Head Eyes
                    ctx.fillStyle = '#000';
                    const eyeSize = tileSize / 5;
                    ctx.fillRect(pxX + tileSize/4, pxY + tileSize/4, eyeSize, eyeSize);
                    ctx.fillRect(pxX + (3*tileSize)/4 - eyeSize, pxY + tileSize/4, eyeSize, eyeSize);
                } else {
                    // Body Gradient Glow
                    const alpha = 1 - (index / snake.length) * 0.6;
                    ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 5;
                    ctx.fillRect(pxX + 2, pxY + 2, tileSize - 4, tileSize - 4);
                }
                ctx.restore();
            });

            // Render Particle Effects
            drawParticles();
        }

        function update() {
            if (isPaused || isGameOver || !isGameRunning) return;

            direction = { ...nextDirection };

            // Don't move if direction is zero
            if (direction.x === 0 && direction.y === 0) return;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall Collision Check
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Move Head
            snake.unshift(head);

            // Food Collision Check
            if (head.x === food.x && head.y === food.y) {
                const points = food.type === 'special' ? 30 : 10;
                score += points;
                scoreEl.innerText = score;

                sound.playEatSound();
                createParticles(food.x, food.y, food.type === 'special' ? '#ffd700' : '#ff007f');

                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem('neon_snake_highscore', highScore);
                }

                spawnFood();
            } else {
                snake.pop();
            }

            updateParticles();
        }

        function gameLoop() {
            update();
            draw();
        }

        function startGame() {
            sound.init();
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            direction = { x: 0, y: -1 };
            nextDirection = { x: 0, y: -1 };
            score = 0;
            scoreEl.innerText = score;
            isGameOver = false;
            isPaused = false;
            isGameRunning = true;
            particles = [];

            spawnFood();

            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            newHighScoreMsg.classList.add('hidden');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameOver() {
            isGameOver = true;
            isGameRunning = false;
            clearInterval(gameInterval);
            sound.playGameOverSound();

            finalScoreEl.innerText = score;
            if (score > 0 && score >= highScore) {
                newHighScoreMsg.classList.remove('hidden');
            }

            gameOverOverlay.classList.remove('hidden');
        }

        function togglePause() {
            if (!isGameRunning || isGameOver) return;
            isPaused = !isPaused;

            if (isPaused) {
                pauseOverlay.classList.remove('hidden');
            } else {
                pauseOverlay.classList.add('hidden');
            }
        }

        function setDirection(dx, dy) {
            if (!isGameRunning || isPaused) return;
            // Prevent 180-degree immediate turns
            if (direction.x + dx !== 0 || direction.y + dy !== 0) {
                if (nextDirection.x !== dx || nextDirection.y !== dy) {
                    nextDirection = { x: dx, y: dy };
                    sound.playTurnSound();
                }
            }
        }

        // Keyboard Listener
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    setDirection(1, 0);
                    break;
                case ' ':
                    togglePause();
                    break;
            }
        });

        // Touch Control Buttons
        document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
        document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
        document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
        document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));
        document.getElementById('btnPause').addEventListener('click', togglePause);

        // Swipe Gesture Handling on Canvas
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            if (!touchStartX || !touchStartY) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 20) {
                    setDirection(diffX > 0 ? 1 : -1, 0);
                }
            } else {
                if (Math.abs(diffY) > 20) {
                    setDirection(0, diffY > 0 ? 1 : -1);
                }
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        // Difficulty Selection
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('bg-cyan-500/30', 'border-pink-500'));
                e.target.classList.add('bg-cyan-500/30', 'border-pink-500');
                gameSpeed = parseInt(e.target.getAttribute('data-speed'));
            });
        });

        // Sound Toggle
        soundToggle.addEventListener('click', () => {
            sound.muted = !sound.muted;
            if (sound.muted) {
                soundIconOn.classList.add('hidden');
                soundIconOff.classList.remove('hidden');
            } else {
                soundIconOn.classList.remove('hidden');
                soundIconOff.classList.add('hidden');
                sound.init();
            }
        });

        // Action Buttons
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        // Initial Canvas Render
        draw();
    </script>
</body>
</html>
